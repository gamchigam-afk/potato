<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>POTATO PHYSICS 🥔</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#world {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

.potato {
    position: absolute;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    will-change: transform;
}

#spawnButton {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: 100px;
    height: 100px;
    border: 3px solid #555;
    border-radius: 50%;
    background: #171717;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    overflow: hidden;
    touch-action: manipulation;
}

#spawnButton img {
    width: 85%;
    height: 85%;
    object-fit: contain;
}

#spawnButton:active {
    transform: translateX(-50%) scale(.92);
}

#counter {
    position: fixed;
    top: 16px;
    left: 16px;
    color: white;
    font-size: 15px;
    pointer-events: none;
    z-index: 10001;
}

#hint {
    position: fixed;
    top: 42px;
    left: 16px;
    color: #888;
    font-size: 12px;
    pointer-events: none;
    z-index: 10001;
}
</style>
</head>

<body>
<div id="world"></div>

<div id="counter">🥔 감자: 0개</div>
<div id="hint">감자를 잡고 움직여 보세요!</div>

<button id="spawnButton" aria-label="감자 생성">
    <img src="potato.png" alt="감자">
</button>

<script>
const world = document.getElementById("world");
const spawnButton = document.getElementById("spawnButton");
const counter = document.getElementById("counter");

const potatoes = [];

const GRAVITY = 0.42;
const WALL_BOUNCE = 0.72;
const POTATO_BOUNCE = 0.78;
const AIR_RESISTANCE = 0.999;
const MAX_SPEED = 30;

let nextId = 0;
let activeDrag = null;
let lastFrame = performance.now();

/* 감자 크기: 기존 크기의 3배, 감자마다 랜덤 */
function randomPotatoSize() {
    return (90 + Math.random() * 40) * 3;
}

/* 감자 생성: 지정한 크기를 그대로 유지 */
function createPotato(x, y, customSize = null) {
    const img = document.createElement("img");
    img.src = "potato.png";
    img.className = "potato";
    img.draggable = false;
    img.alt = "";

    const size = customSize ?? randomPotatoSize();

    const potato = {
        id: nextId++,
        el: img,
        x: x - size / 2,
        y: y - size / 2,
        size,
        vx: (Math.random() - 0.5) * 5,
        vy: Math.random() * 2,
        angle: Math.random() * 360,
        spin: (Math.random() - 0.5) * 5,
        dragging: false,
        mass: size * size
    };

    img.style.width = size + "px";
    img.style.height = size + "px";

    world.appendChild(img);
    potatoes.push(potato);

    updateCounter();
    renderPotato(potato);

    return potato;
}

/* 화면 표시 */
function renderPotato(p) {
    p.el.style.transform =
        `translate3d(${p.x}px, ${p.y}px, 0) rotate(${p.angle}deg)`;
}

function updateCounter() {
    counter.textContent = `🥔 감자: ${potatoes.length}개`;
}

/* 화면 가장자리에서 감자 생성 */
spawnButton.addEventListener("pointerdown", (event) => {
    event.preventDefault();

    const size = randomPotatoSize();
    const edge = Math.floor(Math.random() * 4);

    let x, y, vx, vy;

    if (edge === 0) {
        // 왼쪽
        x = -size;
        y = Math.random() * innerHeight;
        vx = 5 + Math.random() * 7;
        vy = (Math.random() - 0.5) * 8;
    } else if (edge === 1) {
        // 오른쪽
        x = innerWidth;
        y = Math.random() * innerHeight;
        vx = -(5 + Math.random() * 7);
        vy = (Math.random() - 0.5) * 8;
    } else if (edge === 2) {
        // 위쪽
        x = Math.random() * innerWidth;
        y = -size;
        vx = (Math.random() - 0.5) * 8;
        vy = 5 + Math.random() * 7;
    } else {
        // 아래쪽
        x = Math.random() * innerWidth;
        y = innerHeight;
        vx = (Math.random() - 0.5) * 8;
        vy = -(5 + Math.random() * 7);
    }

    // 중요: 가장자리 생성 시 랜덤 크기를 그대로 전달
    const p = createPotato(
        x + size / 2,
        y + size / 2,
        size
    );

    p.vx = vx;
    p.vy = vy;

    renderPotato(p);
});

/* 감자 선택 */
function getPotatoAt(x, y) {
    for (let i = potatoes.length - 1; i >= 0; i--) {
        const p = potatoes[i];

        // 감자 모양 영역을 기준으로 선택
        const cx = p.x + p.size / 2;
        const cy = p.y + p.size / 2;
        const radius = p.size * 0.43;

        if (Math.hypot(x - cx, y - cy) <= radius) {
            return p;
        }
    }

    return null;
}

/* 드래그 시작 */
world.addEventListener("pointerdown", (event) => {
    if (event.target === spawnButton ||
        spawnButton.contains(event.target)) return;

    const p = getPotatoAt(event.clientX, event.clientY);
    if (!p) return;

    event.preventDefault();

    activeDrag = {
        potato: p,
        pointerId: event.pointerId,
        offsetX: event.clientX - p.x,
        offsetY: event.clientY - p.y,
        lastX: event.clientX,
        lastY: event.clientY,
        lastTime: performance.now()
    };

    p.dragging = true;
    p.vx = 0;
    p.vy = 0;
    p.spin = 0;

    try {
        world.setPointerCapture(event.pointerId);
    } catch (_) {}
});

/* 드래그 이동 */
world.addEventListener("pointermove", (event) => {
    if (!activeDrag ||
        event.pointerId !== activeDrag.pointerId) return;

    event.preventDefault();

    const p = activeDrag.potato;
    const now = performance.now();
    const dt = Math.max(1, now - activeDrag.lastTime);

    p.x = event.clientX - activeDrag.offsetX;
    p.y = event.clientY - activeDrag.offsetY;

    p.vx = (event.clientX - activeDrag.lastX) / dt * 16.67;
    p.vy = (event.clientY - activeDrag.lastY) / dt * 16.67;

    activeDrag.lastX = event.clientX;
    activeDrag.lastY = event.clientY;
    activeDrag.lastTime = now;

    p.x = Math.max(0, Math.min(innerWidth - p.size, p.x));
    p.y = Math.max(0, Math.min(innerHeight - p.size, p.y));

    renderPotato(p);
});

/* 드래그 종료: 던지기 */
function stopDrag(event) {
    if (!activeDrag) return;

    if (event &&
        event.pointerId !== undefined &&
        event.pointerId !== activeDrag.pointerId) return;

    const p = activeDrag.potato;

    p.dragging = false;
    p.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, p.vx * 1.25));
    p.vy = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, p.vy * 1.25));
    p.spin = p.vx * 0.45 + (Math.random() - 0.5) * 2;

    activeDrag = null;
}

world.addEventListener("pointerup", stopDrag);
world.addEventListener("pointercancel", stopDrag);

/* 감자끼리 충돌 */
function collide(a, b) {
    const ax = a.x + a.size / 2;
    const ay = a.y + a.size / 2;
    const bx = b.x + b.size / 2;
    const by = b.y + b.size / 2;

    const dx = bx - ax;
    const dy = by - ay;
    const distance = Math.hypot(dx, dy);

    const ra = a.size * 0.43;
    const rb = b.size * 0.43;
    const minDistance = ra + rb;

    if (distance >= minDistance) return;

    const safeDistance = Math.max(distance, 0.01);
    const nx = dx / safeDistance;
    const ny = dy / safeDistance;
    const overlap = minDistance - safeDistance;

    const invA = 1 / a.mass;
    const invB = 1 / b.mass;
    const totalInv = invA + invB;

    // 겹침 보정
    if (!a.dragging && !b.dragging) {
        a.x -= nx * overlap * invA / totalInv;
        a.y -= ny * overlap * invA / totalInv;
        b.x += nx * overlap * invB / totalInv;
        b.y += ny * overlap * invB / totalInv;
    } else if (a.dragging && !b.dragging) {
        b.x += nx * overlap;
        b.y += ny * overlap;
    } else if (!a.dragging && b.dragging) {
        a.x -= nx * overlap;
        a.y -= ny * overlap;
    }

    // 충돌 속도 계산
    const relativeX = b.vx - a.vx;
    const relativeY = b.vy - a.vy;
    const velocityAlongNormal = relativeX * nx + relativeY * ny;

    if (velocityAlongNormal < 0) {
        const impulse =
            -(1 + POTATO_BOUNCE) *
            velocityAlongNormal / totalInv;

        if (!a.dragging) {
            a.vx -= impulse * invA * nx;
            a.vy -= impulse * invA * ny;
        }

        if (!b.dragging) {
            b.vx += impulse * invB * nx;
            b.vy += impulse * invB * ny;
        }

        // 충돌하면 회전
        if (!a.dragging) a.spin += (Math.random() - 0.5) * 3;
        if (!b.dragging) b.spin += (Math.random() - 0.5) * 3;
    }
}

/* 물리 업데이트 */
function update(delta) {
    const step = Math.min(delta / 16.67, 2);

    for (const p of potatoes) {
        if (p.dragging) continue;

        p.vy += GRAVITY * step;
        p.vx *= Math.pow(AIR_RESISTANCE, step);
        p.vy *= Math.pow(AIR_RESISTANCE, step);

        p.x += p.vx * step;
        p.y += p.vy * step;
        p.angle += p.spin * step;

        // 바닥
        if (p.y + p.size > innerHeight) {
            p.y = innerHeight - p.size;

            if (p.vy > 0) {
                p.vy = -p.vy * WALL_BOUNCE;
                p.vx *= 0.995;
                p.spin += p.vx * 0.08;
            }

            if (Math.abs(p.vy) < 0.5) p.vy = 0;
        }

        // 천장
        if (p.y < 0) {
            p.y = 0;
            p.vy = Math.abs(p.vy) * WALL_BOUNCE;
        }

        // 왼쪽 벽
        if (p.x < 0) {
            p.x = 0;
            p.vx = Math.abs(p.vx) * WALL_BOUNCE;
            p.spin += 1;
        }

        // 오른쪽 벽
        if (p.x + p.size > innerWidth) {
            p.x = innerWidth - p.size;
            p.vx = -Math.abs(p.vx) * WALL_BOUNCE;
            p.spin -= 1;
        }

        p.spin *= Math.pow(0.998, step);
    }

    // 모든 감자 쌍의 충돌 처리
    for (let i = 0; i < potatoes.length; i++) {
        for (let j = i + 1; j < potatoes.length; j++) {
            collide(potatoes[i], potatoes[j]);
        }
    }

    for (const p of potatoes) {
        p.x = Math.max(0, Math.min(innerWidth - p.size, p.x));
        p.y = Math.max(0, Math.min(innerHeight - p.size, p.y));
        renderPotato(p);
    }
}

/* 메인 루프 */
function loop(now) {
    const delta = now - lastFrame;
    lastFrame = now;

    update(delta);
    requestAnimationFrame(loop);
}

/* 화면 크기 변경 */
window.addEventListener("resize", () => {
    for (const p of potatoes) {
        p.x = Math.max(0, Math.min(innerWidth - p.size, p.x));
        p.y = Math.max(0, Math.min(innerHeight - p.size, p.y));
        renderPotato(p);
    }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
