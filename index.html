<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>POTATO</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  overscroll-behavior: none;
  font-family: Arial, sans-serif;
}

#world {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #000;
  touch-action: none;
}

.potato {
  position: absolute;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  touch-action: none;
  will-change: transform;
}

.potato.dragging {
  z-index: 9999 !important;
}

#spawn {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 100px;
  padding: 7px;
  border: 2px solid #333;
  border-radius: 25px;
  background: #111;
  display: grid;
  place-items: center;
  z-index: 10000;
  touch-action: manipulation;
}

#spawn:active {
  background: #292929;
  transform: translateX(-50%) scale(.93);
}

#spawn img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

#counter {
  position: fixed;
  top: 18px;
  left: 18px;
  color: #555;
  font-size: 13px;
  z-index: 10001;
  pointer-events: none;
}
</style>
</head>

<body>
<div id="world"></div>
<div id="counter">POTATOES: 0</div>

<button id="spawn" aria-label="감자 생성">
  <img src="potato.png" alt="감자">
</button>

<script>
const world = document.getElementById("world");
const spawnButton = document.getElementById("spawn");
const counter = document.getElementById("counter");

const potatoes = [];

const GRAVITY = 1800;
const BOUNCE = 0.30;
const FRICTION = 0.985;
const RESTITUTION = 0.42;

let lastTime = 0;
let nextId = 0;

function createPotato(x, y) {
  const img = document.createElement("img");

  img.src = "potato.png";
  img.alt = "";
  img.draggable = false;
  img.className = "potato";

  const size = 90 + Math.random() * 40;

  const p = {
    id: nextId++,
    el: img,
    x: x - size / 2,
    y: y - size / 2,
    size,
    vx: (Math.random() - 0.5) * 160,
    vy: 0,
    angle: Math.random() * 360,
    spin: (Math.random() - 0.5) * 100,
    dragging: false,
    pointerId: null,
    grabX: 0,
    grabY: 0,
    lastX: 0,
    lastY: 0,
    lastMoveTime: 0
  };

  img.style.width = size + "px";
  img.style.height = size + "px";

  world.appendChild(img);
  potatoes.push(p);

  img.addEventListener("pointerdown", e => {
    e.preventDefault();

    p.dragging = true;
    p.pointerId = e.pointerId;
    p.vx = 0;
    p.vy = 0;

    p.grabX = e.clientX - p.x;
    p.grabY = e.clientY - p.y;
    p.lastX = e.clientX;
    p.lastY = e.clientY;
    p.lastMoveTime = performance.now();

    img.classList.add("dragging");

    try {
      img.setPointerCapture(e.pointerId);
    } catch (_) {}
  });

  img.addEventListener("pointermove", e => {
    if (!p.dragging || e.pointerId !== p.pointerId) return;

    e.preventDefault();

    const now = performance.now();
    const dt = Math.max((now - p.lastMoveTime) / 1000, 0.001);

    p.vx = (e.clientX - p.lastX) / dt;
    p.vy = (e.clientY - p.lastY) / dt;

    p.x = e.clientX - p.grabX;
    p.y = e.clientY - p.grabY;

    p.x = Math.max(0, Math.min(innerWidth - p.size, p.x));
    p.y = Math.max(0, Math.min(innerHeight - p.size, p.y));

    p.lastX = e.clientX;
    p.lastY = e.clientY;
    p.lastMoveTime = now;

    render(p);
  });

  function release(e) {
    if (!p.dragging || e.pointerId !== p.pointerId) return;

    p.dragging = false;
    p.pointerId = null;
    img.classList.remove("dragging");

    // 손을 떼면 드래그 방향으로 날아감
    p.vx = clamp(p.vx, -1800, 1800);
    p.vy = clamp(p.vy, -1800, 1800);
    p.spin += clamp(p.vx * 0.08, -220, 220);
  }

  img.addEventListener("pointerup", release);
  img.addEventListener("pointercancel", release);

  render(p);
  counter.textContent = "POTATOES: " + potatoes.length;
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function render(p) {
  p.el.style.transform =
    `translate3d(${p.x}px, ${p.y}px, 0) rotate(${p.angle}deg)`;
}

spawnButton.addEventListener("click", () => {
  createPotato(innerWidth / 2, innerHeight - 145);
});

function resolveCollision(a, b) {
  const ax = a.x + a.size / 2;
  const ay = a.y + a.size / 2;
  const bx = b.x + b.size / 2;
  const by = b.y + b.size / 2;

  let dx = bx - ax;
  let dy = by - ay;
  let dist = Math.hypot(dx, dy);

  // 감자의 둥근 충돌 영역
  const ra = a.size * 0.37;
  const rb = b.size * 0.37;
  const minDist = ra + rb;

  if (dist >= minDist) return;

  if (dist < 0.001) {
    dx = 1;
    dy = 0;
    dist = 1;
  }

  const nx = dx / dist;
  const ny = dy / dist;
  const overlap = minDist - dist;

  const ma = a.dragging ? 0 : 1;
  const mb = b.dragging ? 0 : 1;
  const total = ma + mb;

  if (total === 0) return;

  // 겹친 감자를 분리
  a.x -= nx * overlap * ma / total;
  a.y -= ny * overlap * ma / total;
  b.x += nx * overlap * mb / total;
  b.y += ny * overlap * mb / total;

  const avx = a.dragging ? 0 : a.vx;
  const avy = a.dragging ? 0 : a.vy;
  const bvx = b.dragging ? 0 : b.vx;
  const bvy = b.dragging ? 0 : b.vy;

  const rvx = bvx - avx;
  const rvy = bvy - avy;
  const relative = rvx * nx + rvy * ny;

  // 서로 접근 중일 때만 충격량 적용
  if (relative < 0) {
    const impulse = -(1 + RESTITUTION) * relative / total;
    const ix = impulse * nx;
    const iy = impulse * ny;

    if (!a.dragging) {
      a.vx -= ix;
      a.vy -= iy;
    }

    if (!b.dragging) {
      b.vx += ix;
      b.vy += iy;
    }

    // 충돌 지점의 접선 방향으로 회전 발생
    const tangentVelocity = rvx * (-ny) + rvy * nx;
    const torque = clamp(
      tangentVelocity * 0.12 + relative * 0.035,
      -300,
      300
    );

    if (!a.dragging) {
      a.spin = clamp(a.spin - torque, -600, 600);
    }

    if (!b.dragging) {
      b.spin = clamp(b.spin + torque, -600, 600);
    }
  }
}

function animate(time) {
  if (!lastTime) lastTime = time;

  const dt = Math.min((time - lastTime) / 1000, 0.025);
  lastTime = time;

  const width = innerWidth;
  const height = innerHeight;

  // 중력 및 벽 충돌
  for (const p of potatoes) {
    if (p.dragging) continue;

    p.vy += GRAVITY * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.angle += p.spin * dt;

    if (p.x < 0) {
      p.x = 0;
      p.vx = Math.abs(p.vx) * BOUNCE;
      p.spin += p.vy * 0.025;
    }

    if (p.x + p.size > width) {
      p.x = width - p.size;
      p.vx = -Math.abs(p.vx) * BOUNCE;
      p.spin -= p.vy * 0.025;
    }

    if (p.y < 0) {
      p.y = 0;
      p.vy = Math.abs(p.vy) * BOUNCE;
    }

    if (p.y + p.size > height) {
      p.y = height - p.size;
      p.vy = -Math.abs(p.vy) * BOUNCE;

      if (Math.abs(p.vy) < 35) p.vy = 0;

      p.vx *= FRICTION;
      p.spin *= 0.96;
    }
  }

  // 감자끼리 충돌 계산
  // 여러 번 반복해 겹침과 관통을 줄임
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < potatoes.length; i++) {
      for (let j = i + 1; j < potatoes.length; j++) {
        resolveCollision(potatoes[i], potatoes[j]);
      }
    }
  }

  // 충돌 처리 후 화면 경계에 맞춰 정리하고 렌더링
  for (const p of potatoes) {
    if (!p.dragging) {
      p.x = clamp(p.x, 0, Math.max(0, width - p.size));
      p.y = clamp(p.y, 0, Math.max(0, height - p.size));

      // 회전은 서서히 감쇠하되 충돌 시 다시 강해짐
      p.spin *= Math.pow(0.997, dt * 60);

      if (Math.abs(p.spin) < 0.3) p.spin = 0;
    }

    render(p);
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

window.addEventListener("resize", () => {
  for (const p of potatoes) {
    p.x = clamp(p.x, 0, Math.max(0, innerWidth - p.size));
    p.y = clamp(p.y, 0, Math.max(0, innerHeight - p.size));
    render(p);
  }
});
</script>
</body>
</html>
